name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      linux_runner:
        description: Linux runner pool; Nexus runs skip hosted macOS and Windows jobs
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - nexus-run

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXUS_LINUX_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' }}
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: 1.85.0

jobs:
  quality:
    name: Format, lint, and policy
    runs-on: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' && vars.NEXUS_RUNS_ON_LINUX) || '["ubuntu-latest"]') }}
    steps:
      - name: Initialize API-practice evidence
        run: printf '%s\n' '{"schema_version":1,"ok":false,"error":{"code":"practice_gate_not_reached"}}' > "$RUNNER_TEMP/practice-coverage.json"
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap pinned Rustup on Nexus
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' }}
        uses: ./.github/actions/bootstrap-rustup
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Bootstrap pinned linker on Nexus
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' }}
        uses: ./.github/actions/bootstrap-zig-linker
      - name: Install Linux ACL development library
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_runner != 'nexus-run' }}
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libacl1-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Documentation links
        run: cargo test --locked -p reltio-cli --test cli shipped_local_markdown_links_resolve
      - name: Practice release gate
        env:
          RELTIO_CONFIG: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-config/config.toml
          RELTIO_CACHE_DIR: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-cache
          RELTIO_STATE_DIR: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-state
        run: |
          candidate="$RUNNER_TEMP/practice-coverage.next.json"
          diagnostic="$RUNNER_TEMP/practice-coverage.stderr"
          if cargo run --locked -p reltio-cli -- --compact api practices check --strict > "${candidate}" 2> "${diagnostic}"; then
            mv "${candidate}" "$RUNNER_TEMP/practice-coverage.json"
          else
            status="$?"
            cat "${diagnostic}" >&2
            # Cargo may prefix the CLI's structured error with build diagnostics.
            # Keep the real failure when available, otherwise retain the placeholder.
            if tail -n 1 "${diagnostic}" | jq -e 'select(type == "object" and .schema_version == 1 and .ok == false and (.error.code | type == "string"))' > "${candidate}"; then
              mv "${candidate}" "$RUNNER_TEMP/practice-coverage.json"
            fi
            rm -f "${candidate}"
            exit "${status}"
          fi
      - name: Upload API-practice coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-practice-coverage
          path: ${{ runner.temp }}/practice-coverage.json
          if-no-files-found: error
          retention-days: 30

  windows-quality:
    name: Windows compile and lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_runner != 'nexus-run' }}
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run') && '["nexus-run"]' || '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel","windows-latest"]') }}
    runs-on: ${{ matrix.os == 'nexus-run' && fromJSON(vars.NEXUS_RUNS_ON_LINUX) || matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap pinned Rustup on Nexus
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' }}
        uses: ./.github/actions/bootstrap-rustup
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Bootstrap pinned linker on Nexus
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' }}
        uses: ./.github/actions/bootstrap-zig-linker
      - name: Install Linux ACL development library
        if: ${{ runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.linux_runner != 'nexus-run') }}
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libacl1-dev
      - name: Windows security native tests
        if: runner.os == 'Windows'
        run: cargo test --locked -p reltio-windows-security --all-targets --all-features
      - name: Test workspace
        run: cargo test --workspace --exclude reltio-windows-security --all-targets --all-features --locked
      - name: Release login-conflict safety test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo test --release --locked -p reltio-cli --test cli login_commit_conflict_guards_the_winning_profile_and_rolls_back_cache -- --exact
      - name: Release singleflight safety test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo test --release --locked -p reltio-cli --test cli twenty_cli_processes_singleflight_client_credentials -- --exact
      - name: Release final-output lease test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo test --release --locked -p reltio-cli --test cli finite_output_holds_the_cache_lease_through_physical_flush -- --exact
      - name: Release preparse-output lease test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo test --release --locked -p reltio-cli --test cli preparse_help_fails_closed_when_the_cache_lease_is_contended -- --exact
      - name: Release blocked-output deadline test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo test --release --locked -p reltio-cli --test cli blocked_stdout_obeys_the_overall_timeout -- --exact
      - name: Release secret-input deadline test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo test --release --locked -p reltio-cli --test cli secret_stdin_obeys_the_overall_timeout_without_waiting_for_eof -- --exact
      - name: Release token-provenance safety test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo test --release --locked -p reltio-cli --test cli auth_token_refuses_access_token_bytes_that_are_also_a_client_secret -- --exact
      - name: Release profile-removal recovery test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo test --release --locked -p reltio-cli --test cli interrupted_profile_removal_recovers_from_the_durable_cleanup_marker -- --exact
      - name: Unix release blocked-output signal test
        if: ${{ runner.os != 'Windows' && env.NEXUS_LINUX_CI != 'true' }}
        run: cargo test --release --locked -p reltio-cli --test cli sigint_interrupts_blocked_stdout_without_a_success_record -- --exact
      - name: Unix release scan signal test
        if: ${{ runner.os != 'Windows' && env.NEXUS_LINUX_CI != 'true' }}
        run: cargo test --release --locked -p reltio-cli --test cli entity_scan_sigint_preserves_checkpoint_without_a_false_summary -- --exact
      - name: Unix release secret-input signal test
        if: ${{ runner.os != 'Windows' && env.NEXUS_LINUX_CI != 'true' }}
        run: cargo test --release --locked -p reltio-cli --test cli sigint_interrupts_secret_stdin_without_waiting_for_eof -- --exact
      - name: Release build smoke test
        if: env.NEXUS_LINUX_CI != 'true'
        run: cargo build --workspace --release --locked
      - name: Binary smoke test
        if: ${{ runner.os != 'Windows' && env.NEXUS_LINUX_CI != 'true' }}
        env:
          RELTIO_CONFIG: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-config/config.toml
          RELTIO_CACHE_DIR: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-cache
          RELTIO_STATE_DIR: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-state
        run: ./target/release/reltio --version
      - name: Windows binary smoke test
        if: runner.os == 'Windows'
        run: ./target/release/reltio.exe --version

  nexus-release:
    name: Nexus release tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' }}
    runs-on: ${{ fromJSON(vars.NEXUS_RUNS_ON_LINUX) }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap pinned Rustup
        uses: ./.github/actions/bootstrap-rustup
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Bootstrap pinned linker
        uses: ./.github/actions/bootstrap-zig-linker
      - name: Test release workspace
        run: cargo test --workspace --exclude reltio-windows-security --all-targets --all-features --release --locked
      - name: Release build smoke test
        run: cargo build --workspace --release --locked
      - name: Binary smoke test
        env:
          RELTIO_CONFIG: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-config/config.toml
          RELTIO_CACHE_DIR: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-cache
          RELTIO_STATE_DIR: /tmp/reltio-${{ github.run_id }}-${{ github.run_attempt }}-state
        run: ./target/release/reltio --version

  dependencies:
    name: Dependency policy
    runs-on: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' && vars.NEXUS_RUNS_ON_LINUX) || '["ubuntu-latest"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap pinned Rustup on Nexus
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' }}
        uses: ./.github/actions/bootstrap-rustup
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Install dependency-tool Rust toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_runner != 'nexus-run' }}
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install pinned dependency tools on Nexus
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'nexus-run' }}
        uses: ./.github/actions/install-cargo-policy-tools
      - name: Install cargo-audit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_runner != 'nexus-run' }}
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Install cargo-deny
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_runner != 'nexus-run' }}
        run: cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
      - name: Audit advisories
        run: cargo audit --deny warnings
      - name: Check licenses, bans, and sources
        run: cargo deny check
