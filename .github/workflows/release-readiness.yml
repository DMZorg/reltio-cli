name: Stable release readiness

on:
  workflow_call:
    inputs:
      target_release:
        description: Stable MAJOR.MINOR.PATCH release expected by the caller
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_release:
        description: Stable MAJOR.MINOR.PATCH release to validate
        required: true
        default: "0.1.0"
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  EXPECTED_RELEASE: ${{ inputs.target_release || github.ref_name }}
  RUSTUP_TOOLCHAIN: 1.85.0

jobs:
  evidence-tests:
    name: Evidence tests (${{ matrix.os }})
    if: ${{ github.event_name != 'push' || !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Install Linux ACL development library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libacl1-dev
      - name: Execute attributed tests
        run: cargo test --workspace --all-targets --all-features --locked

  product-contract:
    name: Product contract gate
    if: ${{ github.event_name != 'push' || !contains(github.ref_name, '-') }}
    needs: evidence-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Install Linux ACL development library
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libacl1-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Enforce version-bound product contract
        run: cargo run --locked -p reltio-cli -- --compact api practices check --strict --release-ready --expected-release "$EXPECTED_RELEASE" > release-readiness.json
      - name: Upload release-readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-readiness
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 90
