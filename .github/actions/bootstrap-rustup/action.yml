name: Bootstrap pinned Rustup
description: Install an isolated, checksum-verified Rustup on a Linux runner

runs:
  using: composite
  steps:
    - name: Install Rustup 1.28.2
      shell: bash
      env:
        RUSTUP_INIT_SHA256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
        RUSTUP_INIT_VERSION: 1.28.2
      run: |
        set -euo pipefail
        if [ "$(uname -s)" != Linux ] || [ "$(uname -m)" != x86_64 ]; then
          printf '%s\n' 'the pinned Rustup bootstrap requires x86_64 Linux' >&2
          exit 1
        fi

        cargo_home="$RUNNER_TEMP/cargo-home"
        rustup_home="$RUNNER_TEMP/rustup-home"
        installer="$RUNNER_TEMP/rustup-init"
        mkdir -p "$cargo_home" "$rustup_home"
        curl \
          --fail \
          --location \
          --proto '=https' \
          --retry 5 \
          --retry-all-errors \
          --show-error \
          --silent \
          --tlsv1.2 \
          --output "$installer" \
          "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
        printf '%s  %s\n' "$RUSTUP_INIT_SHA256" "$installer" | sha256sum --check --strict -
        chmod 0700 "$installer"
        CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" \
          "$installer" -y --profile minimal --default-toolchain none --no-modify-path

        {
          printf 'CARGO_HOME=%s\n' "$cargo_home"
          printf 'RUSTUP_HOME=%s\n' "$rustup_home"
        } >> "$GITHUB_ENV"
        printf '%s\n' "$cargo_home/bin" >> "$GITHUB_PATH"
        CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" \
          "$cargo_home/bin/rustup" --version
