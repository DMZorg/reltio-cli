name: Bootstrap pinned Zig linker
description: Install an isolated Zig toolchain and expose the host ACL runtime for linking

runs:
  using: composite
  steps:
    - name: Install Zig 0.16.0
      shell: bash
      env:
        ZIG_ARCHIVE_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        ZIG_VERSION: 0.16.0
      run: |
        set -euo pipefail
        if [ "$(uname -s)" != Linux ] || [ "$(uname -m)" != x86_64 ]; then
          printf '%s\n' 'the pinned Zig bootstrap requires x86_64 Linux' >&2
          exit 1
        fi

        archive="$RUNNER_TEMP/zig.tar.xz"
        zig_dir="$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}"
        curl \
          --fail \
          --location \
          --proto '=https' \
          --retry 5 \
          --retry-all-errors \
          --show-error \
          --silent \
          --tlsv1.2 \
          --output "$archive" \
          "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
        printf '%s  %s\n' "$ZIG_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
        tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
        zig="$zig_dir/zig"
        [ -x "$zig" ]

        acl_runtime=''
        for candidate in \
          /lib/x86_64-linux-gnu/libacl.so.1 \
          /usr/lib/x86_64-linux-gnu/libacl.so.1 \
          /lib64/libacl.so.1 \
          /usr/lib64/libacl.so.1; do
          if [ -f "$candidate" ]; then
            acl_runtime="$candidate"
            break
          fi
        done
        if [ -z "$acl_runtime" ]; then
          printf '%s\n' 'the Nexus host does not provide the libacl.so.1 runtime' >&2
          exit 1
        fi

        native_lib="$RUNNER_TEMP/native-lib"
        mkdir -p "$native_lib"
        ln -s "$acl_runtime" "$native_lib/libacl.so"

        cc_wrapper="$RUNNER_TEMP/zig-cc"
        cxx_wrapper="$RUNNER_TEMP/zig-cxx"
        ar_wrapper="$RUNNER_TEMP/zig-ar"
        ranlib_wrapper="$RUNNER_TEMP/zig-ranlib"
        cp "$GITHUB_ACTION_PATH/compiler-wrapper.sh" "$cc_wrapper"
        cp "$GITHUB_ACTION_PATH/compiler-wrapper.sh" "$cxx_wrapper"
        printf '#!/bin/sh\nexec "%s" ar "$@"\n' "$zig" > "$ar_wrapper"
        printf '#!/bin/sh\nexec "%s" ranlib "$@"\n' "$zig" > "$ranlib_wrapper"
        chmod 0700 "$cc_wrapper" "$cxx_wrapper" "$ar_wrapper" "$ranlib_wrapper"

        export NEXUS_ZIG="$zig"
        export NEXUS_NATIVE_LIB="$native_lib"
        smoke_source="$RUNNER_TEMP/acl-link-smoke.c"
        smoke_binary="$RUNNER_TEMP/acl-link-smoke"
        printf '%s\n' 'extern int acl_free(void *); int main(void) { return acl_free(0); }' > "$smoke_source"
        "$cc_wrapper" "$smoke_source" -lacl -o "$smoke_binary"

        library_path="$native_lib"
        if [ -n "${LIBRARY_PATH:-}" ]; then
          library_path="$library_path:$LIBRARY_PATH"
        fi
        {
          printf 'AR=%s\n' "$ar_wrapper"
          printf 'CC=%s\n' "$cc_wrapper"
          printf 'CXX=%s\n' "$cxx_wrapper"
          printf 'RANLIB=%s\n' "$ranlib_wrapper"
          printf 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=%s\n' "$cc_wrapper"
          printf 'LIBRARY_PATH=%s\n' "$library_path"
          printf 'NEXUS_NATIVE_LIB=%s\n' "$native_lib"
          printf 'NEXUS_ZIG=%s\n' "$zig"
          printf 'ZIG_GLOBAL_CACHE_DIR=%s\n' "$RUNNER_TEMP/zig-cache"
        } >> "$GITHUB_ENV"
        "$zig" version
