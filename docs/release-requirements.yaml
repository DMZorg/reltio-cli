acceptance_scenarios:
  - { id: MVP-ACCEPT-001, summary: "Profile creation, client-credential or SSO login, and entity retrieval without manual config editing", source_section: "16.3.1", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-002, summary: "Headless environment and credential-process authentication without secret arguments", source_section: "16.3.2", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-003, summary: "Twenty processes share cached client-credential state without a token storm", source_section: "16.3.3", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-004, summary: "Expired-token refresh and at most one explicit 401 replay", source_section: "16.3.4", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-005, summary: "Entity and relation scans stream cursor pages and resumable checkpoints", source_section: "16.3.5", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-006, summary: "Entity-create transport timeout cannot trigger a duplicate write", source_section: "16.3.6", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-007, summary: "Structured stdout remains valid around progress warnings and retries", source_section: "16.3.7", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-008, summary: "Every documented exit condition has its stable code and envelope", source_section: "16.3.8", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-009, summary: "Configuration apply rejects inherited stale invalid mismatched or unconfirmed input", source_section: "16.3.9", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-010, summary: "Trace output excludes every credential and sensitive header class", source_section: "16.3.10", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-011, summary: "Raw requests cannot leak authorization through redirects or protected headers", source_section: "16.3.11", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-012, summary: "Agent skills and schemas use only exact-version commands and flags", source_section: "16.3.12", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-013, summary: "Every MVP typed endpoint has complete source-linked practice disposition", source_section: "16.3.13", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-014, summary: "Retry tests prove exact status ceilings and no ambiguous mutation replay", source_section: "16.3.14", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-015, summary: "Entity batching enforces object body concurrency and adaptive-pressure limits", source_section: "16.3.15", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-016, summary: "Search and scan prove boundaries encoding page ceilings expiry and resume behavior", source_section: "16.3.16", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-017, summary: "Configuration apply uses If-Unmodified-Since and non-retried 412 conflict handling", source_section: "16.3.17", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-018, summary: "Opaque multi-kilobyte tokens survive every provider cache and redaction path", source_section: "16.3.18", implementation_test_ids: [] }
  - { id: MVP-ACCEPT-019, summary: "Raw metadata distinguishes coverage and unreviewed mutation acknowledgement", source_section: "16.3.19", implementation_test_ids: [] }

