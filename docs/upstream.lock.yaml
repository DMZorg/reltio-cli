      sha256: c2dc4300d28fb7ffa7989230a482fda30b47ddd25af7e1e18cb33706885e5cde
  notes: >-
    Reviewed the official AI-ready corpus through its 2026-08-21 synchronization,
    current English documentation, 2026.1 release notes through 2026.1.9.0,
    current deprecation notices, and the live Data Operation OpenAPI for every
    operation registered in endpoints.yaml. Release-note pages, deprecation
    notices, and every distinct practice source are locked by per-URL effective
    URL, normalized visible text, and resolved HTTP(S) link targets, as well as
    aggregate URL/index position and canonical index links. The version 2
    migration revalidated every prior visible-text digest before adding the URL
    and link-target inputs. The scoped corpus drift clarified
    Entity Search sorting and does not change the implemented request contract.
    Rechecked authentication token lifetime, same-token original-validity,
    caching, request limits, retry guidance, response shape, and opaque-token
    handling. The 2026.1.9.0 potential-match change truncates selected returned
    relevance values to two decimal places instead of rounding them; the CLI
    preserves server values, order, and matchActionLabel without local score or
    action derivation. DEV/TEST rollout is scheduled for 2026-08-21 and PRD for
    2026-08-28, so tenant behavior remains deployment-dependent. Exact CLI 429
    ceilings are recorded as conservative local policy, not as upstream limits.
    The live OpenAPI payload and corrected potential-match and cursor-scan
    endpoint, method, path, and operation ID bindings are locked above. English documentation still
    specifies POST /entities/_scan while the legacy 2020.2 OpenAPI exposes only
    /entities/v2/_scan; the reviewed English route remains selected, while the
    schema's conservative 200-entity response ceiling is applied to the selected
    documented route. Its four-value options enum is used only as a conservative
    allowlist; transmission requires --allow-unverified-scan-options and raw
    option-bearing requests remain partial coverage. The English and canonical
    AI-ready cursor topic omits options, so applicability to the unversioned route
    is not claimed as live-tenant verified. A connector-specific corpus topic describes the options
    with incompatible route and cursor details and is not treated as route
    authority. The conflicting /entities/v2/_scan alias remains unregistered and
    is refused until live-tenant pilot verification resolves the mismatch before
    stable release.
