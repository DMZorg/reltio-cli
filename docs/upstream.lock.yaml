  notes: >-
    Reviewed the official AI-ready corpus through its 2026-09-11 synchronization,
    all registered practice sources in current English documentation, release
    notes through 2026.1.10.0, all twelve deprecation notices and their index,
    and the live Data Operation OpenAPI operation bindings. The new token-rate
    topic describes an undisclosed per-source-IP rolling limit. Older client
    credentials guidance still names ten requests per second; the CLI retains
    ten only as a conservative local policy, not an upstream guarantee. Caching,
    bounded 429 retries and shared-egress recovery guidance apply together.
    Get Entity and Crosswalk corpus changes expand survivorship diagnostics;
    existing lossless responses preserve the new nested rule tree. Crosswalk
    diagnostic options outside the English/OpenAPI intersection stay deferred.
    The new hierarchy crosswalk and bulk attribute-task options are outside
    registered typed coverage. The new August 2027 RDM legacy appspot endpoint
    retirement does not affect the default RDM service URL; custom RDM routes
    remain unreviewed and require the configured tenant production endpoint.
    Rechecked existing internal sign-in and opaque-token deprecation guards;
    other notices concern deferred UI, workflow, cleansing and connector features.
    Authentication lifetimes, same-token original validity, body limits, search
    bounds, history ordering conflicts and potential-match caveats are unchanged.
    All source fingerprints include effective URL, normalized visible text and
    resolved HTTP(S) links, with aggregate manifests and index/sitemap state.
    English documentation still specifies POST /entities/_scan while the legacy
    2020.2 OpenAPI exposes /entities/v2/_scan. The English route remains selected;
    the conservative 200-entity ceiling and four-option allowlist are unchanged.
    Option transmission requires --allow-unverified-scan-options; raw option
    requests remain partial and the conflicting versioned alias is refused.
    This documentation review is not live-tenant or stable-release verification.
