practices:
  - id: AUTH-CENTRALIZED-001
    title: Use the centralized authentication service
    classification: deprecation
    enforcement: hard_guard
    api_family: authentication
    service: auth
    methods: [POST]
    path_patterns: ["/oauth/token"]
    summary: Use https://auth.reltio.com/oauth/token by default and hard-reject the retired tenant-internal sign-in path; explicit custom identity-provider hosts remain partially reviewed.
    source:
      url: https://docs.reltio.com/en/reltio/whats-new-and-notable/whats-new-at-a-glance/deprecation-notices-at-a-glance/internal-api-sign-in-service---oct-2023
      section: Internal API sign in service
      updated_at: 2024-12-09
    reviewed_at: 2026-08-10
