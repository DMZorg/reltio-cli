    implementation: crates/reltio-client/src/service.rs
    test_ids: [auth_url_is_centralized, deprecated_auth_path_absent, deprecated_auth_path_refused]

  - id: AUTH-CLIENT-CREDENTIALS-001
    title: Authenticate confidential machine clients with client credentials
    classification: requirement
    enforcement: hard_guard
    api_family: authentication
    service: auth
    methods: [POST]
    path_patterns: ["/oauth/token"]
    summary: Send client credentials with HTTP Basic authentication and a form-encoded client_credentials grant; never place credentials in a URL.
    source:
      url: https://docs.reltio.com/en/developer-resources/system-administration-apis/system-administration-apis-at-a-glance/authentication-api/obtaining-access-tokens-with-client-credentials-grant-type
      section: Request
      updated_at: 2026-07-31
    reviewed_at: 2026-08-10
    commands: [auth.login, auth.check, auth.token, entity.get, entity.by-crosswalk, entity.search, entity.scan, entity.history, entity.matches, api.request, doctor]
    implementation: crates/reltio-client/src/auth.rs
    test_ids: [auth_client_credentials_request, auth_login_secret_source_conflict, auth_login_secret_read_order, auth_login_prior_credential_guard, auth_provider_preparse_guard, auth_credential_process_preparse_guard]

  - id: AUTH-TOKEN-CACHE-001
    title: Cache and reuse access tokens until expiry
    classification: limit
    enforcement: adaptive_policy
    api_family: authentication
    service: auth
    methods: [POST]
    path_patterns: ["/oauth/token"]
    limits:
      token_requests_per_second: 10
      default_token_lifetime_seconds: 3600
    summary: Reuse a token until expiry, reject candidates that are unusable inside the local skew window before replacing a cache preimage, coordinate acquisition to avoid the token endpoint's 10-request-per-second limit, and stop rather than creating repeated refresh generations when a rejected token is reissued unchanged.
    source:
      url: https://docs.reltio.com/en/developer-resources/system-administration-apis/system-administration-apis-at-a-glance/authentication-api/obtaining-access-tokens-with-client-credentials-grant-type
      section: Token API request limit
      updated_at: 2026-07-31
    reviewed_at: 2026-08-10
    commands: [auth.login, auth.status, auth.check, auth.token, auth.logout, entity.get, entity.by-crosswalk, entity.search, entity.scan, entity.history, entity.matches, api.request, doctor]
    implementation: crates/reltio-client/src/auth.rs
    test_ids: [auth_singleflight_cache, auth_cross_process_singleflight, auth_expired_cache_refresh, auth_provider_expiry_guard, auth_candidate_expiry_guard, auth_same_token_reissue_guard, auth_login_cache_transaction, auth_login_cache_reader_isolation, auth_login_profile_rollback, auth_login_malformed_displaced_cache, auth_login_commit_conflict, auth_login_output_preflight, auth_login_warning_preflight, auth_login_output_state, auth_login_broken_pipe_state, auth_logout_partial_commit, auth_global_cache_output_guard, auth_orphan_cache_output_guard]

  - id: AUTH-TOKEN-REISSUE-001
    title: Preserve the original validity of reissued client-credentials tokens
    classification: requirement
    enforcement: adaptive_policy
    api_family: authentication
    service: auth
    methods: [POST]
    path_patterns: ["/oauth/token"]
    summary: Without Multi Token Support, identical token bytes retain the validity established when first issued; an early acquisition or explicit login must preserve the earlier acquisition time and must not extend the cached expiry.
    source:
      url: https://docs.reltio.com/en/developer-resources/system-administration-apis/system-administration-apis-at-a-glance/authentication-api/multi-token-support
      section: Understanding Multi Token Support
      updated_at: 2026-07-31
    reviewed_at: 2026-08-10
    commands: [auth.login, auth.status, auth.check, auth.token, auth.logout, entity.get, entity.by-crosswalk, entity.search, entity.scan, entity.history, entity.matches, api.request, doctor]
    implementation: crates/reltio-client/src/auth.rs
    test_ids: [auth_explicit_reissue_lifetime, auth_same_token_reissue_guard]

  - id: AUTH-OPAQUE-TOKEN-001
    title: Treat access tokens as opaque variable-length secrets
    classification: deprecation
    enforcement: hard_guard
    api_family: authentication
    service: auth
    methods: [POST]
    path_patterns: ["/oauth/token"]
    limits:
      documented_jwt_size_characters: 3000
    summary: JWT access tokens replaced UUID tokens; storage and redaction must not assume a UUID shape or fixed length, and every final or orphaned local cache generation remains part of final-byte output guards.
    source:
      url: https://docs.reltio.com/en/reltio/whats-new-and-notable/whats-new-at-a-glance/deprecation-notices-at-a-glance/uuid-format-for-60-minute-authentication-tokens---apr-2024
      section: What action do you need to take?
      updated_at: 2024-12-09
    reviewed_at: 2026-08-10
    commands: [auth.login, auth.status, auth.check, auth.token, auth.logout, entity.get, entity.by-crosswalk, entity.search, entity.scan, entity.history, entity.matches, api.request, doctor]
    implementation: crates/reltio-client/src/auth.rs
    test_ids: [opaque_token_roundtrip, opaque_token_redaction, auth_token_raw_cumulative_guard, auth_prior_cache_disclosure_guard, auth_raw_broken_pipe_state, auth_output_newline_guard, auth_token_raw_newline_guard, auth_malformed_cache_guard, auth_malformed_cache_duplicate_guard, auth_global_cache_output_guard, auth_cached_help_output_guard, auth_orphan_cache_output_guard, auth_provider_preparse_guard, auth_credential_process_preparse_guard, auth_refresh_token_validation, auth_refresh_token_no_commit, auth_login_output_preflight, auth_login_warning_preflight]

  - id: AUTH-TOKEN-RETRY-001
    title: Do not retry token failures except one bounded rate-limit replay
    classification: requirement
    enforcement: hard_guard
    api_family: authentication
    service: auth
    methods: [POST]
    path_patterns: ["/oauth/token"]
    limits:
      status_429_replays: 1
    summary: Token transport and non-429 HTTP failures receive one attempt; a 429 may be replayed once within the auth deadline even when its diagnostic body is oversized, and --no-retry disables that replay.
    source:
      url: https://docs.reltio.com/en/developer-resources/system-administration-apis/system-administration-apis-at-a-glance/authentication-api/access-reltio-apis
      section: API Error Retries
      updated_at: 2026-07-31
    reviewed_at: 2026-08-10
    commands: [auth.login, auth.check, auth.token, entity.get, entity.by-crosswalk, entity.search, entity.scan, entity.history, entity.matches, api.request, doctor]
    implementation: crates/reltio-client/src/auth.rs
    test_ids: [auth_token_non_rate_limit_no_retry, auth_rate_limit_single_retry, auth_rate_limit_oversized_replay, auth_rate_limit_oversized_terminal, auth_no_retry_disables_token_replay]

  - id: AUTH-BEARER-001
    title: Sign Data API requests with a bearer access token
    classification: requirement
    enforcement: automatic_default
    api_family: data
    service: data
    methods: [GET, POST]
    path_patterns: ["/entities", "/entities/{id}", "/entities/_byCrosswalk/{crosswalkValue}", "/entities/_search", "/entities/_scan", "/entities/{id}/_changes", "/entities/{id}/_matches"]
    operations:
      - { method: GET, path_pattern: "/entities" }
      - { method: GET, path_pattern: "/entities/{id}" }
      - { method: GET, path_pattern: "/entities/_byCrosswalk/{crosswalkValue}" }
      - { method: GET, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_scan" }
      - { method: GET, path_pattern: "/entities/{id}/_changes" }
      - { method: GET, path_pattern: "/entities/{id}/_matches" }
    summary: Add exactly one Authorization header in Bearer access-token format.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api
      section: Entities API
      updated_at: 2026-07-31
    reviewed_at: 2026-08-08
    commands: [auth.check, entity.get, entity.by-crosswalk, entity.search, entity.scan, entity.history, entity.matches, api.request, doctor]
    implementation: crates/reltio-client/src/http.rs
    test_ids: [entity_get_contract, entity_crosswalk_contract, entity_history_contract, entity_matches_contract, protected_authorization_header]

  - id: HTTP-RETRY-001
    title: Apply status-specific retry ceilings only to replay-safe requests
    classification: recommendation
    enforcement: adaptive_policy
    api_family: cross_cutting
    service: any
    excluded_services: [auth]
    methods: [GET, POST]
    path_patterns: ["*"]
    limits:
      status_429_attempts: 5
      status_502_attempts: 10
      status_503_attempts: 12
      status_504_attempts: 5
    summary: Outside the token endpoint's more specific policy, do not retry 403, 404, or 500; honor Retry-After for replay-safe 429 responses and use 1,3,7,... second exponential backoff for replay-safe 429, 502, 503, and 504 responses.
    source:
      url: https://docs.reltio.com/en/developer-resources/system-administration-apis/system-administration-apis-at-a-glance/search-using-activity-log-api/api-error-codes
      section: Best Practice for Retry Mechanism
      updated_at: 2025-04-29
    reviewed_at: 2026-08-08
    commands: [auth.check, entity.get, entity.by-crosswalk, entity.search, entity.scan, entity.history, entity.matches, api.request, doctor]
    implementation: crates/reltio-client/src/http.rs
    test_ids: [retry_matrix, retry_backoff_sequence, retry_oversized_body_replay, retry_oversized_body_terminal, no_retry_500]

  - id: HTTP-POST-SIZE-001
    title: Keep every POST body at or below 50 MB
    classification: limit
    enforcement: hard_guard
    api_family: cross_cutting
    service: any
    excluded_services: [auth]
    methods: [POST]
    path_patterns: ["*"]
    limits:
      hard_body_bytes: 52428800
      recommended_min_body_bytes: 10485760
      recommended_max_body_bytes: 20971520
    summary: Reject POST bodies over 50 MB before network I/O; batching workflows should target 10-20 MB.
    source:
      url: https://docs.reltio.com/en/reltio/whats-in-the-box/whats-in-the-box-at-a-glance/implementation-assistance-at-a-glance/implementation-assistance-operation/identify-performance-factors/quota-and-limits/api-request-limits
      section: Maximum POST request size
      updated_at: 2025-06-27
    reviewed_at: 2026-08-08
    commands: [auth.check, entity.search, entity.scan, api.request, doctor]
    implementation: crates/reltio-client/src/http.rs
    test_ids: [post_body_size_guard]

