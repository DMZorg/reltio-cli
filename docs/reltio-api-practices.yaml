  - id: ENTITY-SEARCH-BOUNDARY-001
    title: Enforce the 10,000-result offset-search boundary
    classification: limit
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET, POST]
    path_patterns: ["/entities", "/entities/_search"]
    operations:
      - { method: GET, path_pattern: "/entities" }
      - { method: GET, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_search" }
    limits:
      offset_plus_max: 10000
      default_max: 50
    summary: Refuse offset and max combinations above 10,000, warn when a full page reaches the boundary, and direct exhaustive work to cursor scan or export.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/entity-search
      section: Parameters
      updated_at: 2026-08-07
    reviewed_at: 2026-08-08
    commands: [entity.search, auth.check, api.request, doctor]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_search_boundary, entity_search_boundary_warning_outputs, raw_entity_search_boundary_warning_outputs]

