    title: Respect entity cursor lifecycle and terminal pages
    classification: behavior
    enforcement: adaptive_policy
    api_family: entity
    service: data
    methods: [POST]
    path_patterns: ["/entities/_scan"]
    limits:
      ordinary_ttl_seconds_after_last_read: 86400
      preserved_ttl_seconds_after_last_read: 3600
