  - id: ENTITY-CROSSWALK-CONTRACT-001
    title: Use the narrowed GET entity-by-crosswalk contract
    classification: behavior
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/_byCrosswalk/{crosswalkValue}"]
    limits:
      options: [sendHidden, ovOnly, nonOvOnly]
      conservative_cli_get_subset: RFC3986_unreserved
    summary: Require type, normalize CRM and configuration/sources/CRM spellings when checking the returned tuple, preserve optional sourceTable, allow only the three response options shared by the current reference and OpenAPI, reject conflicting OV options, and conservatively route values outside the unreserved subset to the deferred POST variant because Reltio does not precisely define "special characters". Preserve the response wrapper and warn from both typed and raw adapters when a successful object lacks the requested crosswalk tuple because Reltio documents an ID fallback in that case.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/get-entity-by-crosswalk
      section: Request, Parameters, and Response
      updated_at: 2026-07-31
    reviewed_at: 2026-09-15
    commands: [entity.by-crosswalk, api.request]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_crosswalk_contract, entity_crosswalk_validation, entity_crosswalk_id_fallback, entity_crosswalk_source_normalization, raw_entity_crosswalk_preflight, raw_entity_crosswalk_fallback_warning]

