    commands: [entity.search, auth.check, entity.scan, api.request, doctor]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_search_filter_guard, entity_scan_filter_guard, query_plus_encoding, raw_query_filter_guard]

  - id: ENTITY-HISTORY-CONTRACT-001
    title: Preserve the reviewed Entity History request and response contract
    classification: behavior
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}/_changes"]
    limits:
      default_max: 50
      options: [skipReferenceAttributesProcessing]
      order: [asc, desc]
    summary: Have the typed command send an explicit order, and require raw callers to provide one for reviewed coverage, because the reference and OpenAPI defaults conflict; reject filter with showAll because Reltio ignores that filter, expose the one documented performance option deliberately because it can omit reference-attribute deltas, and preserve the ObjectChangeTO array without remodeling.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/entity-history
      section: Parameters and Response
      updated_at: 2026-07-31
