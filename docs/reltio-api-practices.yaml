  - id: ENTITY-FILTER-QUERY-001
    title: Prevent query-filter truncation and preserve literal plus signs
    classification: limit
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET, POST]
    path_patterns: ["/entities", "/entities/_search", "/entities/_scan"]
    operations:
      - { method: GET, path_pattern: "/entities" }
      - { method: GET, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_scan" }
    limits:
      processed_query_characters: 256
      list_equals_rows: 5000
      list_equals_file_bytes: 10485760
    summary: Reject entity filters over 256 characters, encode query-transport literal plus as %2B, and enforce file-backed listEquals limits when the CLI owns the file.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/filtering-entities
      section: Format
      updated_at: 2026-07-31
    reviewed_at: 2026-08-08
    commands: [entity.search, auth.check, entity.scan, api.request, doctor]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_search_filter_guard, entity_scan_filter_guard, query_plus_encoding, raw_query_filter_guard]

  - id: ENTITY-HISTORY-CONTRACT-001
    title: Preserve the reviewed Entity History request and response contract
    classification: behavior
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}/_changes"]
    limits:
      default_max: 50
      options: [skipReferenceAttributesProcessing]
      order: [asc, desc]
    summary: Have the typed command send an explicit order, and require raw callers to provide one for reviewed coverage, because the reference and OpenAPI defaults conflict; reject filter with showAll because Reltio ignores that filter, expose the one documented performance option deliberately because it can omit reference-attribute deltas, and preserve the ObjectChangeTO array without remodeling.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/entity-history
      section: Parameters and Response
      updated_at: 2026-07-31
    reviewed_at: 2026-08-11
    commands: [entity.history, api.request]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_history_contract, entity_history_boundary, raw_entity_history_preflight]

  - id: ENTITY-HISTORY-PERFORMANCE-001
    title: Explain Entity History performance tradeoffs before selection
    classification: recommendation
    enforcement: actionable_warning
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}/_changes"]
    summary: Reltio recommends showAll=true when no changes filter is used and skipReferenceAttributesProcessing for lower latency; keep both caller-selected because showAll changes event inclusion and the skip option can omit reference-attribute deltas.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/entity-history
      section: Response-time recommendations
      updated_at: 2026-07-31
    reviewed_at: 2026-08-11
    commands: [entity.history, api.request]
    implementation: crates/reltio-cli/src/commands/api.rs
    test_ids: [entity_history_guidance, raw_entity_history_preflight]

  - id: ENTITY-HISTORY-CANONICAL-VALUES-001
