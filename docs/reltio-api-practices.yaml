  - id: ENTITY-SEARCH-BOUNDARY-001
    title: Enforce the 10,000-result offset-search boundary
    classification: limit
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET, POST]
    path_patterns: ["/entities", "/entities/_search"]
    operations:
      - { method: GET, path_pattern: "/entities" }
      - { method: GET, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_search" }
    limits:
      offset_plus_max: 10000
      default_max: 50
    summary: Refuse offset and max combinations above 10,000, warn when a full page reaches the boundary, and direct exhaustive work to cursor scan or export.
