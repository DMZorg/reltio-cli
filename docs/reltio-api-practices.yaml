  - id: ENTITY-HISTORY-BOUNDARY-001
    title: Stay within the 1,000-event Entity History boundary
    classification: limit
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}/_changes"]
    limits:
      offset_plus_max: 1000
      default_max: 50
    summary: Refuse offset plus max above 1,000 and warn when a full page reaches the boundary because the current reference says pagination does not work beyond the most recent 1,000 events, despite broader wording in OpenAPI when major-events-only is disabled.
