  - id: ENTITY-MATCHES-CONTRACT-001
    title: Retrieve stored direct potential matches without forced recalculation
    classification: behavior
    enforcement: automatic_default
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}/_matches"]
    limits:
      cli_default_max: 50
      upstream_default_max: 200
      offset_default: 0
      deep: 1
      transitive: false
      forceMatch: false
      match_types: [automatic, relevance_based, suspect]
    summary: Keep the typed MVP read-only and replay-safe by explicitly requesting stored direct matches, hard-refuse raw forceMatch=true until recalculation safety is reviewed, require raw callers to set deep=1 for reviewed direct-only coverage, limit type filters to the documented built-ins, preserve the dynamic object of match-group arrays, and do not invent continuation metadata because grouped pagination cardinality is undocumented. Reltio documents 200 as a default, not a maximum.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/potential-matches-api
      section: Request, Parameters, and Response
      updated_at: 2026-07-31
    reviewed_at: 2026-09-15
    commands: [entity.matches, api.request]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_matches_contract, entity_matches_validation, raw_entity_matches_preflight]

  - id: ENTITY-MATCHES-FRESHNESS-001
    title: Warn that stored potential matches can be absent or out of date
    classification: behavior
    enforcement: actionable_warning
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}/_matches"]
    summary: Warn on every stored potential-match read that ON_REQUEST can return empty or outdated results, strategy NONE disables matching, and custom PUBLISH_POTENTIAL_LINK_PAIR results are absent unless SuspectMatchHandler persists them; forceMatch remains outside the reviewed typed and raw contract.
