    test_ids: [entity_matches_contract, raw_entity_matches_preflight]

  - id: ENTITY-MATCHES-RELEVANCE-PRECISION-001
    title: Preserve server-owned potential-match relevance and action labels
    classification: release_change
    enforcement: automatic_default
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}/_matches"]
    summary: After 2026.1.9.0 reaches a tenant, selected matching APIs truncate returned relevance to two decimal places instead of rounding; DEV/TEST rollout is scheduled for 2026-08-21 and PRD for 2026-08-28. Preserve the server value, response order, and matchActionLabel exactly; do not locally truncate, round, sort, threshold, or derive an action from the displayed score.
    source:
      url: https://docs.reltio.com/en/reltio/release-notes-at-a-glance/2026.1-release-notes/2026.1-bi-weekly-release-notes-rn
      section: 2026.1.9.0 RN - Matching APIs truncate displayed relevance scores
      updated_at: 2026-08-21
    reviewed_at: 2026-09-15
    commands: [entity.matches, api.request]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_matches_relevance_precision]

  - id: ENTITY-LOSSLESS-001
    title: Preserve evolving entity response fields losslessly
    classification: release_change
    enforcement: automatic_default
    api_family: entity
    service: data
    methods: [GET, POST]
    path_patterns: ["/entities", "/entities/{id}", "/entities/_byCrosswalk/{crosswalkValue}", "/entities/_search", "/entities/_scan", "/entities/{id}/_matches"]
    operations:
      - { method: GET, path_pattern: "/entities" }
      - { method: GET, path_pattern: "/entities/{id}" }
      - { method: GET, path_pattern: "/entities/_byCrosswalk/{crosswalkValue}" }
      - { method: GET, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_scan" }
      - { method: GET, path_pattern: "/entities/{id}/_matches" }
    summary: Preserve every field and value within the reviewed response schemas, including wrapper fields, match-group results, and newer explainOv survivorship details, rather than remodeling payloads lossily; reject top-level shapes outside an endpoint's current OpenAPI schema and keep explicit upstream field/value limits caller-visible.
