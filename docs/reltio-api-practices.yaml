    test_ids: [entity_history_contract, entity_history_boundary, raw_entity_history_preflight]

  - id: ENTITY-HISTORY-PERFORMANCE-001
    title: Explain Entity History performance tradeoffs before selection
    classification: recommendation
    enforcement: actionable_warning
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}/_changes"]
    summary: Reltio recommends showAll=true when no changes filter is used and skipReferenceAttributesProcessing for lower latency; keep both caller-selected because showAll changes event inclusion and the skip option can omit reference-attribute deltas.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/entity-history
