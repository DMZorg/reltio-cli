  - id: AUTH-TOKEN-CACHE-001
    title: Cache and reuse access tokens until expiry
    classification: limit
    enforcement: adaptive_policy
    api_family: authentication
    service: auth
    methods: [POST]
    path_patterns: ["/oauth/token"]
    limits:
      local_token_requests_per_second: 10
      default_token_lifetime_seconds: 3600
    summary: Reuse a token until expiry, reject candidates that are unusable inside the local skew window before replacing a cache preimage, coordinate acquisition with a local ten-request-per-second throttle; the upstream rolling limit is undisclosed and shared by source IP, so unrelated caches and hosts can still receive 429, and stop rather than creating repeated refresh generations when a rejected token is reissued unchanged.
    source:
      url: https://docs.reltio.com/en/developer-resources/system-administration-apis/system-administration-apis-at-a-glance/authentication-api/authentication-token-api-rate-limiting
      section: Recommended practices
      updated_at: 2026-09-04
    reviewed_at: 2026-09-15
    commands: [auth.login, auth.status, auth.check, auth.token, auth.logout, entity.get, entity.by-crosswalk, entity.search, entity.scan, entity.history, entity.matches, api.request, doctor]
    implementation: crates/reltio-client/src/auth.rs
    test_ids: [auth_singleflight_cache, auth_cross_process_singleflight, auth_expired_cache_refresh, auth_provider_expiry_guard, auth_candidate_expiry_guard, auth_same_token_reissue_guard, auth_login_cache_transaction, auth_login_cache_reader_isolation, auth_login_profile_rollback, auth_login_malformed_displaced_cache, auth_login_commit_conflict, auth_login_output_preflight, auth_login_warning_preflight, auth_login_output_state, auth_login_broken_pipe_state, auth_bearer_generation_switch, auth_bearer_generation_crash_isolation, auth_bearer_generation_collision, auth_logout_partial_commit, auth_logout_cache_linearization, auth_global_cache_output_guard, auth_orphan_cache_output_guard, auth_cache_output_guard_lease, auth_cache_output_guard_control, auth_cli_final_output_lease, auth_preparse_output_lease, auth_output_timeout_control, auth_output_sigint_control, auth_output_event_order, auth_control_source_order, auth_profile_candidate_credential_guard, auth_profile_candidate_locked_guard, auth_profile_removal_recovery, auth_profile_removal_compensation, auth_profile_removal_pending_union, auth_profile_remove_without_bearer, auth_bearer_transition_cleanup, auth_bearer_cache_migration, auth_storage_path_isolation, auth_macos_storage_case_isolation, auth_unix_storage_physical_alias, auth_unix_storage_casefold_isolation, auth_macos_storage_firmlink_isolation, auth_windows_storage_casefold_and_tilde_rejection, auth_credential_process_cache_identity, auth_cancellation_outcome]

  - id: AUTH-TOKEN-REISSUE-001
    title: Preserve the original validity of reissued client-credentials tokens
    classification: requirement
    enforcement: adaptive_policy
    api_family: authentication
    service: auth
    methods: [POST]
    path_patterns: ["/oauth/token"]
    summary: Without Multi Token Support, identical token bytes retain the validity established when first issued; an early acquisition or explicit login must preserve the earlier acquisition time and must not extend the cached expiry.
    source:
      url: https://docs.reltio.com/en/developer-resources/system-administration-apis/system-administration-apis-at-a-glance/authentication-api/multi-token-support
      section: Understanding Multi Token Support
      updated_at: 2026-07-31
    reviewed_at: 2026-09-15
