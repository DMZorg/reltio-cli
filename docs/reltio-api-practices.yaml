  - id: ENTITY-GET-PARAMETERS-001
    title: Preserve the documented Get Entity query contract
    classification: behavior
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}"]
    limits:
      select_top_level: [uri, type, tags, createdBy, createdTime, updatedBy, updatedTime, isFavorite, analyticsAttributes, label, secondaryLabel, crosswalks, attributes]
      select_attribute_path: attributes.<non-empty path>
      options: [sendHidden, ovOnly, nonOvOnly, serializeInitialSourcesInCrosswalks, cleanEntity, showAppliedSurvivorshipRules, showEndDatedReferenceAttributes, explainOv]
    summary: Expose and validate the exact documented select grammar, historical time in Unix milliseconds, response options, duplicate-crosswalk merging, value limits, explicit survivorship groups, reverse transcoding, and viewing-mode masking without silently dropping caller intent.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity
      section: Parameters
      updated_at: 2026-07-31
    reviewed_at: 2026-08-09
    commands: [entity.get, api.request]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_get_query_parameters, raw_entity_get_query_parameters, raw_entity_get_invalid_query, entity_get_parameter_validation]

  - id: ENTITY-GET-REVERSE-TRANSCODE-001
    title: Warn when requesting Preview reverse transcoding
    classification: release_change
    enforcement: actionable_warning
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/{id}"]
    summary: Reltio's introduction note classified reverseTranscodeLookups as Preview and no later GA notice was found in the reviewed corpus; expose the documented parameter while warning callers to verify tenant availability and destination mappings.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity
      section: Reverse Transcoding
      updated_at: 2026-07-31
    reviewed_at: 2026-08-09
    commands: [entity.get, api.request]
    implementation: crates/reltio-cli/src/commands/entity.rs
    test_ids: [entity_get_query_parameters, raw_entity_get_query_parameters, entity_get_preview_warning_outputs]

  - id: ENTITY-CROSSWALK-CONTRACT-001
    title: Use the narrowed GET entity-by-crosswalk contract
    classification: behavior
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET]
    path_patterns: ["/entities/_byCrosswalk/{crosswalkValue}"]
    limits:
      options: [sendHidden, ovOnly, nonOvOnly]
      conservative_cli_get_subset: RFC3986_unreserved
    summary: Require type, preserve optional sourceTable, allow only the three response options shared by the current reference and OpenAPI, reject conflicting OV options, and conservatively route values outside the unreserved subset to the deferred POST variant because Reltio does not precisely define "special characters". Preserve the response wrapper and warn when a successful object lacks the requested crosswalk tuple because Reltio documents an ID fallback in that case.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/get-entity-by-crosswalk
      section: Request, Parameters, and Response
      updated_at: 2026-07-31
    reviewed_at: 2026-08-11
    commands: [entity.by-crosswalk, api.request]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_crosswalk_contract, entity_crosswalk_validation, entity_crosswalk_id_fallback, raw_entity_crosswalk_preflight]

