  - id: ENTITY-SCAN-OPTIONS-001
    title: Constrain entity cursor-scan options under the documented route mismatch
    classification: behavior
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [POST]
    path_patterns: ["/entities/_scan"]
    limits:
      conservative_allowed_options: [sendHidden, searchByOv, ovOnly, nonOvOnly]
      mutually_exclusive_options: [[ovOnly, nonOvOnly]]
    summary: The locked Data Operation OpenAPI exposes sendHidden, searchByOv, ovOnly, and nonOvOnly for its conflicting /entities/v2/_scan route. The CLI rejects every other value and the ovOnly/nonOvOnly pair, then requires --allow-unverified-scan-options before sending any of the four on /entities/_scan. Raw option requests receive partial coverage. This explicit acknowledgement does not claim live-tenant verification.
    source:
      url: https://developer.reltio.com/swagger/Data%20Operation
      section: Entities > getEntitiesByScanSearch > POST /services/reltio/api/{tenantId}/entities/v2/_scan > options
      updated_at: 2026-08-21
    reviewed_at: 2026-09-15
    commands: [entity.scan, api.request]
    implementation: crates/reltio-client/src/entities.rs
    test_ids: [entity_scan_options_contract, raw_entity_scan_options_prebody, entity_scan_option_acknowledgement]
    rationale: Current English and canonical AI-ready cursor documentation selects /entities/_scan but omits options. A connector-specific corpus topic describes the options with incompatible route and cursor details, so it is not route authority. The allowlist is therefore a conservative schema intersection under a recorded route conflict, not evidence that the unversioned option contract works on a live tenant.

  - id: ENTITY-FILTER-QUERY-001
    title: Prevent query-filter truncation and preserve literal plus signs
    classification: limit
    enforcement: hard_guard
    api_family: entity
    service: data
    methods: [GET, POST]
    path_patterns: ["/entities", "/entities/_search", "/entities/_scan"]
    operations:
      - { method: GET, path_pattern: "/entities" }
      - { method: GET, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_search" }
      - { method: POST, path_pattern: "/entities/_scan" }
    limits:
      processed_query_characters: 256
      list_equals_rows: 5000
      list_equals_file_bytes: 10485760
    summary: Reject entity filters over 256 characters, encode query-transport literal plus as %2B, and enforce file-backed listEquals limits when the CLI owns the file.
    source:
      url: https://docs.reltio.com/en/developer-resources/entity-management-apis/entity-management-apis-at-a-glance/entities-api/get-entity/filtering-entities
      section: Format
