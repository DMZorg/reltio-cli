[workspace]
members = [
    "crates/reltio-client",
    "crates/reltio-cli",
    "crates/reltio-windows-security",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/aiadjacent/reltio-cli"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
directories = "6"
exacl = "0.13"
fs2 = "0.4"
futures-util = "0.3"
httpdate = "1"
humantime = "2"
is-terminal = "0.4"
libc = "0.2"
memchr = "2"
percent-encoding = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
rustix = { version = "1", features = ["fs", "process"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = "=0.61.2"
# 0.6.5 uses let-chains that are unavailable on the Rust 1.85 MSRV.
wiremock = "=0.6.4"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
